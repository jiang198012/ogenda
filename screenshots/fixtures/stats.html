<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ogenda</title>
<style>

:root {
  --background-primary: #ffffff;
  --background-secondary: #f5f5f5;
  --background-modifier-hover: #e8e8e8;
  --background-modifier-active-hover: #dcdcdc;
  --background-modifier-border: #d4d4d4;
  --interactive-accent: #7c3aed;
  --interactive-accent-hover: #6d28d9;
  --text-normal: #1f2937;
  --text-muted: #6b7280;
  --text-faint: #9ca3af;
  --text-on-accent: #ffffff;
  --text-error: #dc2626;
  --font-text-size: 16px;
}

body {
  margin: 0;
  padding: 0;
  background: var(--background-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text-normal);
}
.viewport {
  width: 900px;
  min-height: 800px;
  border: 1px solid var(--background-modifier-border);
  overflow: hidden;
}
</style>
<link rel="stylesheet" href="../../styles.css">
</head>
<body>
<div class="viewport">
<div class="ogenda-panel">
  <div class="ogenda-panel-head">
    <div class="ogenda-panel-tabs">
      <div class="ogenda-panel-tab active">清单</div>
      <div class="ogenda-panel-tab">日</div>
      <div class="ogenda-panel-tab">周</div>
      <div class="ogenda-panel-tab">月</div>
      <div class="ogenda-panel-tab">统计</div>
    </div>
    <div class="ogenda-panel-nav">
      <span class="ogenda-navbtn">‹</span>
      <span class="ogenda-navtoday">今天 · 7月21日</span>
      <span class="ogenda-navbtn">›</span>
      <span class="ogenda-navtoday-btn">今天</span>
    </div>
    <div class="ogenda-panel-newbtn">+ 新建</div>
    <div class="ogenda-panel-syncbtn"><span>同步</span></div>
  </div>
  <div class="ogenda-panel-body">

  <div class="ogenda-stat-kpis">
    <div class="ogenda-kpi"><div class="ogenda-kpi-num">12</div><div class="ogenda-kpi-label">本月事件</div></div>
    <div class="ogenda-kpi"><div class="ogenda-kpi-num" style="color:#22c55e">8</div><div class="ogenda-kpi-label">已确认</div></div>
    <div class="ogenda-kpi"><div class="ogenda-kpi-num" style="color:#f59e0b">3</div><div class="ogenda-kpi-label">待定</div></div>
    <div class="ogenda-kpi ogenda-kpi-warn"><div class="ogenda-kpi-num" style="color:var(--text-error)">1</div><div class="ogenda-kpi-label">未同步</div></div>
  </div>

  <div class="ogenda-stat-card">
    <div class="ogenda-stat-card-title">状态分布</div>
    <div class="ogenda-stat-bar-row">
      <span class="ogenda-stat-bar-label" style="color:#22c55e">已确认</span>
      <div class="ogenda-stat-bar-track"><div class="ogenda-stat-bar-fill" style="width:100%;background:#22c55e"></div></div>
      <span class="ogenda-stat-bar-count">8</span>
    </div>
    <div class="ogenda-stat-bar-row">
      <span class="ogenda-stat-bar-label" style="color:#f59e0b">待定</span>
      <div class="ogenda-stat-bar-track"><div class="ogenda-stat-bar-fill" style="width:38%;background:#f59e0b"></div></div>
      <span class="ogenda-stat-bar-count">3</span>
    </div>
    <div class="ogenda-stat-bar-row">
      <span class="ogenda-stat-bar-label" style="color:#6b7280">未设置</span>
      <div class="ogenda-stat-bar-track"><div class="ogenda-stat-bar-fill" style="width:13%;background:#6b7280"></div></div>
      <span class="ogenda-stat-bar-count">1</span>
    </div>
  </div>

  <div class="ogenda-stat-card">
    <div class="ogenda-stat-card-title">分类分布</div>
    <div class="ogenda-cat-chips">
      <span class="ogenda-cat-chip"><span class="ogenda-cat-chip-bar" style="background:#7c3aed"></span><span>工作</span><span class="ogenda-cat-chip-count">5</span></span>
      <span class="ogenda-cat-chip"><span class="ogenda-cat-chip-bar" style="background:#06b6d4"></span><span>会议</span><span class="ogenda-cat-chip-count">3</span></span>
      <span class="ogenda-cat-chip"><span class="ogenda-cat-chip-bar" style="background:#22c55e"></span><span>健康</span><span class="ogenda-cat-chip-count">2</span></span>
      <span class="ogenda-cat-chip"><span class="ogenda-cat-chip-bar" style="background:#f59e0b"></span><span>个人</span><span class="ogenda-cat-chip-count">2</span></span>
    </div>
  </div>

  <div class="ogenda-stat-minis">
    <div class="ogenda-stat-mini"><div class="ogenda-stat-mini-label">全天 / 带时间</div><div class="ogenda-stat-mini-val">2 / 10</div></div>
    <div class="ogenda-stat-mini"><div class="ogenda-stat-mini-label">循环事件</div><div class="ogenda-stat-mini-val">3</div></div>
    <div class="ogenda-stat-mini"><div class="ogenda-stat-mini-label">最忙一天</div><div class="ogenda-stat-mini-val">7月21日 · 4</div></div>
  </div>

  </div>
</div>
</div>
</body>
</html>
