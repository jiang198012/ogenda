<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ogenda</title>
<style>

:root {
  --background-primary: #ffffff;
  --background-secondary: #f5f5f5;
  --background-modifier-hover: #e8e8e8;
  --background-modifier-active-hover: #dcdcdc;
  --background-modifier-border: #d4d4d4;
  --interactive-accent: #7c3aed;
  --interactive-accent-hover: #6d28d9;
  --text-normal: #1f2937;
  --text-muted: #6b7280;
  --text-faint: #9ca3af;
  --text-on-accent: #ffffff;
  --text-error: #dc2626;
  --font-text-size: 16px;
}

body {
  margin: 0;
  padding: 0;
  background: var(--background-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--text-normal);
}
.viewport {
  width: 375px;
  min-height: 800px;
  border: 1px solid var(--background-modifier-border);
  overflow: hidden;
}
</style>
<link rel="stylesheet" href="../../styles.css">
</head>
<body>
<div class="viewport">
<div class="ogenda-panel">
  <div class="ogenda-panel-head">
    <div class="ogenda-panel-tabs">
      <div class="ogenda-panel-tab active">List</div>
      <div class="ogenda-panel-tab">Day</div>
      <div class="ogenda-panel-tab">Week</div>
      <div class="ogenda-panel-tab">Month</div>
      <div class="ogenda-panel-tab">Stats</div>
    </div>
    <div class="ogenda-panel-nav">
      <span class="ogenda-navbtn">‹</span>
      <span class="ogenda-navtoday">Today · Jul 21</span>
      <span class="ogenda-navbtn">›</span>
      <span class="ogenda-navtoday-btn">Today</span>
    </div>
    <div class="ogenda-panel-newbtn">New event</div>
    <div class="ogenda-panel-syncbtn"><span>Sync</span></div>
  </div>
  <div class="ogenda-panel-body">
<div class="ogenda-list-statusgroup">
  <div class="ogenda-list-statusheader">Confirmed · 3</div>
  <div class="ogenda-list-statusitems">
    <div class="ogenda-event-row" style="border-left-color: #7c3aed;">
      <div class="ogenda-event-when"><span class="ogenda-event-date">Jul 21</span><span class="ogenda-event-time">09:00–10:00</span></div>
      <div class="ogenda-event-main"><div class="ogenda-event-title">Team weekly standup</div><div class="ogenda-event-loc">Room A</div></div>
      <span class="ogenda-status-pill" style="color:#fff;background:#22c55e;">Confirmed</span>
      <span class="ogenda-cat-pill" style="color:#7c3aed;background:rgba(124,58,237,0.12);">Work</span>
    </div>
    <div class="ogenda-event-row" style="border-left-color: #7c3aed;">
      <div class="ogenda-event-when"><span class="ogenda-event-date">Jul 21</span><span class="ogenda-event-time">14:00–15:00</span></div>
      <div class="ogenda-event-main"><div class="ogenda-event-title">Client review</div><div class="ogenda-event-loc">Zoom</div></div>
      <span class="ogenda-status-pill" style="color:#fff;background:#22c55e;">Confirmed</span>
      <span class="ogenda-cat-pill" style="color:#7c3aed;background:rgba(124,58,237,0.12);">Work</span>
    </div>
  </div>
</div>
<div class="ogenda-list-statusgroup">
  <div class="ogenda-list-statusheader">Tentative · 1</div>
  <div class="ogenda-list-statusitems">
    <div class="ogenda-event-row" style="border-left-color: #f59e0b;">
      <div class="ogenda-event-when"><span class="ogenda-event-date">Jul 22</span><span class="ogenda-event-time">All day</span></div>
      <div class="ogenda-event-main"><div class="ogenda-event-title">Quarterly planning</div></div>
      <span class="ogenda-status-pill" style="color:#fff;background:#f59e0b;">Tentative</span>
      <span class="ogenda-cat-pill" style="color:#f59e0b;background:rgba(245,158,11,0.12);">Meeting</span>
    </div>
  </div>
</div>

  </div>
</div>
</div>
</body>
</html>
