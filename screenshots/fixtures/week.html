<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ogenda</title>
<style>

:root {
  --background-primary: #ffffff;
  --background-secondary: #f5f5f5;
  --background-modifier-hover: #e8e8e8;
  --background-modifier-active-hover: #dcdcdc;
  --background-modifier-border: #d4d4d4;
  --interactive-accent: #7c3aed;
  --interactive-accent-hover: #6d28d9;
  --text-normal: #1f2937;
  --text-muted: #6b7280;
  --text-faint: #9ca3af;
  --text-on-accent: #ffffff;
  --text-error: #dc2626;
  --font-text-size: 16px;
}

body {
  margin: 0;
  padding: 0;
  background: var(--background-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--text-normal);
}
.viewport {
  width: 900px;
  min-height: 800px;
  border: 1px solid var(--background-modifier-border);
  overflow: hidden;
}
</style>
<link rel="stylesheet" href="../../styles.css">
</head>
<body>
<div class="viewport">
<div class="ogenda-panel">
  <div class="ogenda-panel-head">
    <div class="ogenda-panel-tabs">
      <div class="ogenda-panel-tab active">List</div>
      <div class="ogenda-panel-tab">Day</div>
      <div class="ogenda-panel-tab">Week</div>
      <div class="ogenda-panel-tab">Month</div>
      <div class="ogenda-panel-tab">Stats</div>
    </div>
    <div class="ogenda-panel-nav">
      <span class="ogenda-navbtn">‹</span>
      <span class="ogenda-navtoday">Today · Jul 21</span>
      <span class="ogenda-navbtn">›</span>
      <span class="ogenda-navtoday-btn">Today</span>
    </div>
    <div class="ogenda-panel-newbtn">New event</div>
    <div class="ogenda-panel-syncbtn"><span>Sync</span></div>
  </div>
  <div class="ogenda-panel-body">
<div class="ogenda-week-grid">
  <div class="ogenda-week-col-head" style="color:#3B82F6">Mon 20</div>
  <div class="ogenda-week-col-head" style="color:#22C55E">Tue 21</div>
  <div class="ogenda-week-col-head" style="color:#06B6D4">Wed 22</div>
  <div class="ogenda-week-col-head" style="color:#A855F7">Thu 23</div>
  <div class="ogenda-week-col-head" style="color:#64748B">Fri 24</div>
  <div class="ogenda-week-col-head" style="color:#F59E0B">Sat 25</div>
  <div class="ogenda-week-col-head" style="color:#EF4444">Sun 26</div>
  <div class="ogenda-week-col">
    <div class="ogenda-week-card" style="border-left-color:#7c3aed">
      <div class="ogenda-week-card-time">09:00</div>
      <div class="ogenda-week-card-title">Standup</div>
      <div class="ogenda-week-card-loc">Room A</div>
    </div>
  </div>
  <div class="ogenda-week-col">
    <div class="ogenda-week-card" style="border-left-color:#06b6d4">
      <div class="ogenda-week-card-time">14:00</div>
      <div class="ogenda-week-card-title">Client review</div>
      <div class="ogenda-week-card-loc">Zoom</div>
    </div>
    <div class="ogenda-week-card" style="border-left-color:#7c3aed">
      <div class="ogenda-week-card-time">16:00</div>
      <div class="ogenda-week-card-title">Design sync</div>
    </div>
  </div>
  <div class="ogenda-week-col">
    <div class="ogenda-week-card" style="border-left-color:#f59e0b">
      <div class="ogenda-week-card-time">All day</div>
      <div class="ogenda-week-card-title">Planning</div>
    </div>
  </div>
  <div class="ogenda-week-col">
    <div class="ogenda-week-card" style="border-left-color:#22c55e">
      <div class="ogenda-week-card-time">10:00</div>
      <div class="ogenda-week-card-title">Gym</div>
      <div class="ogenda-week-card-loc">Fitness</div>
    </div>
  </div>
  <div class="ogenda-week-col">
  </div>
  <div class="ogenda-week-col">
    <div class="ogenda-week-card" style="border-left-color:#ef4444">
      <div class="ogenda-week-card-time">11:00</div>
      <div class="ogenda-week-card-title">Brunch</div>
    </div>
  </div>
  <div class="ogenda-week-col">
  </div>
</div>
  </div>
</div>
</div>
</body>
</html>
