<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ogenda</title>
<style>

:root {
  --background-primary: #ffffff;
  --background-secondary: #f5f5f5;
  --background-modifier-hover: #e8e8e8;
  --background-modifier-active-hover: #dcdcdc;
  --background-modifier-border: #d4d4d4;
  --interactive-accent: #7c3aed;
  --interactive-accent-hover: #6d28d9;
  --text-normal: #1f2937;
  --text-muted: #6b7280;
  --text-faint: #9ca3af;
  --text-on-accent: #ffffff;
  --text-error: #dc2626;
  --font-text-size: 16px;
}

body {
  margin: 0;
  padding: 0;
  background: var(--background-primary);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text-normal);
}
.viewport {
  width: 375px;
  min-height: 800px;
  border: 1px solid var(--background-modifier-border);
  overflow: hidden;
}
</style>
<link rel="stylesheet" href="../../styles.css">
</head>
<body>
<div class="viewport">
<div class="ogenda-panel">
  <div class="ogenda-panel-head">
    <div class="ogenda-panel-tabs">
      <div class="ogenda-panel-tab active">清单</div>
      <div class="ogenda-panel-tab">日</div>
      <div class="ogenda-panel-tab">周</div>
      <div class="ogenda-panel-tab">月</div>
      <div class="ogenda-panel-tab">统计</div>
    </div>
    <div class="ogenda-panel-nav">
      <span class="ogenda-navbtn">‹</span>
      <span class="ogenda-navtoday">今天 · 7月21日</span>
      <span class="ogenda-navbtn">›</span>
      <span class="ogenda-navtoday-btn">今天</span>
    </div>
    <div class="ogenda-panel-newbtn">+ 新建</div>
    <div class="ogenda-panel-syncbtn"><span>同步</span></div>
  </div>
  <div class="ogenda-panel-body">
